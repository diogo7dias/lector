<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossPoint Reader</title>
    <style>
      /* Monochrome UI. These pages mirror the e-reader's own screen: black on
         white, square edges, no hues. State is carried by weight, borders and
         fills instead of colour. */
      :root {
        --ink: #000;
        --paper: #fff;
        --muted: #555;
        --faint: #949494;
        /* Native controls (checkboxes, radios) paint black instead of blue. */
        accent-color: #000;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.4;
      }
      h1 {
        margin: 0 0 15px;
        padding: 12px 16px;
        background: var(--ink);
        color: var(--paper);
        font-size: 1.3em;
        text-align: center;
        letter-spacing: 0.05em;
      }
      h2 {
        margin: 0 0 12px;
        padding-bottom: 6px;
        font-size: 1.05em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 2px solid var(--ink);
      }
      .card {
        background: var(--paper);
        border: 2px solid var(--ink);
        padding: 20px;
        margin: 15px 0;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--ink);
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .label {
        font-weight: 600;
        color: var(--muted);
      }
      .value {
        color: var(--ink);
        font-weight: 600;
        text-align: right;
        word-break: break-word;
      }
      .status {
        display: inline-block;
        padding: 3px 12px;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.8em;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .nav-links {
        margin: 15px 0;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .nav-links a {
        padding: 9px 16px;
        background: var(--paper);
        border: 2px solid var(--ink);
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      .nav-links a.active {
        background: var(--ink);
        color: var(--paper);
      }
      /* Hover feedback without colour: an outlined control fills in. */
      .nav-links a:not(.active):hover {
        background: var(--ink);
        color: var(--paper);
      }
      /* Colour emoji are the last hue left in the markup. Desaturate them on
         leaf elements only: `filter` makes an element a containing block for
         fixed-position descendants, so it must never go on body. */
      h1,
      h2,
      .nav-links a {
        filter: grayscale(1);
      }
      @media (max-width: 600px) {
        body {
          padding: 10px;
          font-size: 14px;
        }
        .card {
          padding: 12px;
          margin: 10px 0;
        }
        h1 {
          font-size: 1.15em;
        }
        .nav-links a {
          padding: 8px 12px;
          font-size: 0.9em;
        }
      }
    </style>
  </head>
  <body>
    <h1>📚 CrossPoint Reader</h1>

    <div class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/files">File Manager</a>
      <a href="/settings">Settings</a>
      <a href="/fonts">Fonts</a>
    </div>

    <div class="card">
      <h2>Device Status</h2>
      <div class="info-row">
        <span class="label">Serial #</span>
        <span class="value" id="serial"></span>
      </div>
      <div class="info-row">
        <span class="label">Version</span>
        <span class="value" id="version"></span>
      </div>
      <div class="info-row">
        <span class="label">WiFi Status</span>
        <span class="status">Connected</span>
      </div>
      <div class="info-row">
        <span class="label">IP Address</span>
        <span class="value" id="ip-address"></span>
      </div>
      <div class="info-row">
        <span class="label">Free Memory</span>
        <span class="value" id="free-heap"></span>
      </div>
    </div>

    <div class="card">
      <p style="text-align: center; color: var(--muted); margin: 0">
        CrossPoint E-Reader • Open Source
      </p>
    </div>
  <script>
    async function fetchStatus() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) {
          throw new Error('Failed to fetch status: ' + response.status + ' ' + response.statusText);
        }
        const data = await response.json();
        document.getElementById('version').textContent = data.version || 'N/A';
        document.getElementById('serial').textContent = data.serial;
        document.getElementById('ip-address').textContent = data.ip || 'N/A';
        document.getElementById('free-heap').textContent = data.freeHeap
          ? data.freeHeap.toLocaleString() + ' bytes'
          : 'N/A';
      } catch (error) {
        console.error('Error fetching status:', error);
      }
    }

    // Fetch status on page load
    window.onload = fetchStatus;
  </script>
  </body>
</html>
