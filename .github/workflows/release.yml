name: Compile Release
on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only, so creating the release
    # returns HTTP 403 without this. Granted at job level and limited to contents,
    # which is the only scope the publish step needs. The flasher-site push uses its
    # own WALLPAPER_REPO_TOKEN and is unaffected.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # The device shows CROSSPOINT_VERSION, built from platformio.ini's crosspoint.version;
      # the flasher site shows a string derived from this tag. Two sources, so a tag pushed
      # without bumping platformio.ini would put "lector 0.24.2" on the site and leave
      # "lector 0.24.1" on the home screen, in Settings and in every crash report. Fail the
      # release here instead, before anything is built or published.
      - name: Check the tag matches the firmware version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PIO_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' platformio.ini | head -n1)"
          if [ -z "$PIO_VERSION" ]; then
            echo "No version line found in platformio.ini." >&2
            exit 1
          fi
          # Experimental tags carry no three-part number and ship their own version string
          # to the site, so there is nothing to match; release candidates append -rc to the
          # same number the tag names.
          if [[ "$TAG" =~ ^lector\.exp\.[0-9]+$ ]]; then
            # The experimental channel publishes the tag name itself as the version, so
            # the firmware string has to be that same name, not a stable number.
            if [ "$PIO_VERSION" != "$TAG" ]; then
              echo "Tag/firmware version mismatch." >&2
              echo "  tag:            $TAG" >&2
              echo "  expected:       version = $TAG" >&2
              echo "  platformio.ini: version = $PIO_VERSION" >&2
              exit 1
            fi
            echo "Experimental tag $TAG matches platformio.ini."
            exit 0
          fi
          NUM="${TAG#lector-}"
          NUM="${NUM#v}"
          NUM="${NUM%%-rc*}"
          NUM="${NUM%%-RC*}"
          EXPECTED="lector ${NUM}"
          if [ "$PIO_VERSION" != "$EXPECTED" ]; then
            echo "Tag/firmware version mismatch." >&2
            echo "  tag:            $TAG" >&2
            echo "  expected:       version = $EXPECTED" >&2
            echo "  platformio.ini: version = $PIO_VERSION" >&2
            echo "Bump crosspoint.version in platformio.ini to match the tag, or retag." >&2
            exit 1
          fi
          echo "Tag $TAG matches platformio.ini ($PIO_VERSION)."

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      # Attaches the firmware binaries to a GitHub Release for the tag so a manual
      # flash (esptool, or copying firmware.bin onto the SD card for Settings ->
      # SD Card Firmware Update) needs no build environment. Creates the release if
      # the tag has none, otherwise uploads the assets onto the existing one.
      - name: Publish GitHub release with firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BUILD_DIR=.pio/build/gh_release
          for f in firmware.bin bootloader.bin partitions.bin firmware.elf; do
            test -f "$BUILD_DIR/$f" || { echo "missing $BUILD_DIR/$f" >&2; exit 1; }
          done
          ASSETS=("$BUILD_DIR/firmware.bin" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin" "$BUILD_DIR/firmware.elf")
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' | head -n1)"
          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" "$BUILD_DIR/boot_app0.bin"
            ASSETS+=("$BUILD_DIR/boot_app0.bin")
          fi
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          **Easiest install:** use the [browser flasher](https://diogo7dias.github.io/lector-xteink-firmware/#flash) (Chrome/Edge, USB cable). One build serves both Xteink X3 and X4.

          **Update from the SD card:** download `firmware.bin`, copy it to the SD card, then on the device open Settings and choose SD Card Firmware Update.

          **Manual flash (esptool):**
          ```
          esptool.py --chip esp32c3 write_flash \
            0x0 bootloader.bin \
            0x8000 partitions.bin \
            0xE000 boot_app0.bin \
            0x10000 firmware.bin
          ```
          `firmware.elf` is for symbolizing crash reports, not for flashing.

          ---
          EOF
          PRERELEASE_FLAG=""
          # Experimental builds are untested on a device, so they are prereleases too.
          case "$TAG" in *rc*|*RC*|lector.exp.*) PRERELEASE_FLAG="--prerelease" ;; esac
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Lector $TAG" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi

      # Publishes the freshly built binaries into the wallpaper site so its
      # /flash page can serve the latest build to the browser flasher.
      # Stable tags only (skips *-rc*). Needs a fine-grained PAT with
      # Contents:write on lector-xteink-firmware, stored as WALLPAPER_REPO_TOKEN.
      - name: Publish firmware to flasher site
        if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') }}
        env:
          WALLPAPER_TOKEN: ${{ secrets.WALLPAPER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WALLPAPER_TOKEN:-}" ]; then
            echo "WALLPAPER_REPO_TOKEN is not set; skipping flasher publish." >&2
            exit 0
          fi
          # Two channels, decided by the tag.
          #   "lector.exp.N"  -> the experimental button, for firmware not yet proven
          #                      on a device. Published as its own version string, its
          #                      own firmware dir and its own manifest, so the stable
          #                      button is untouched.
          #   "lector-X.Y.Z"  -> the stable Update button (older tags were "vX.Y.Z").
          # The site's tests enforce both display forms: "lector X.Y.Z" for stable and
          # "lector.exp.N" for experimental, and that the two are never equal.
          if [[ "$GITHUB_REF_NAME" =~ ^lector\.exp\.[0-9]+$ ]]; then
            CHANNEL=experimental
            VERSION="$GITHUB_REF_NAME"
            FW_DIR=experimental
            VERSION_FILE=experimental-version.txt
            MANIFESTS="manifest-experimental.json"
          else
            CHANNEL=stable
            NUM="${GITHUB_REF_NAME#lector-}"
            NUM="${NUM#v}"
            VERSION="lector ${NUM}"
            FW_DIR=latest
            VERSION_FILE=version.txt
            MANIFESTS="manifest-update.json manifest-full.json"
          fi
          echo "Publishing $VERSION to the $CHANNEL channel."
          BUILD_DIR=.pio/build/gh_release
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' | head -n1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found in the framework package." >&2
            exit 1
          fi
          for f in firmware.bin bootloader.bin partitions.bin; do
            test -f "$BUILD_DIR/$f" || { echo "missing $BUILD_DIR/$f" >&2; exit 1; }
          done
          git clone --depth 1 \
            "https://x-access-token:${WALLPAPER_TOKEN}@github.com/diogo7dias/lector-xteink-firmware.git" site
          DEST="site/flash/firmware/${FW_DIR}"
          mkdir -p "$DEST"
          cp "$BUILD_DIR/firmware.bin" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin" "$DEST/"
          cp "$BOOT_APP0" "$DEST/boot_app0.bin"
          printf '%s' "$VERSION" > "site/flash/${VERSION_FILE}"
          # Heredoc, not python3 -c with "\n": inside single quotes the shell passes the
          # backslash-n through literally, so Python saw one line and raised SyntaxError.
          python3 - "$VERSION" "$FW_DIR" $MANIFESTS <<'PY'
          import json, os, sys

          version, fw_dir, names = sys.argv[1], sys.argv[2], sys.argv[3:]
          for name in names:
              path = os.path.join("site/flash", name)
              if os.path.exists(path):
                  with open(path) as fh:
                      data = json.load(fh)
              else:
                  # The experimental manifest is created on its first publish. Same shape
                  # as the update manifest (app-only: boot_app0 + firmware, no erase), only
                  # pointed at this channel's firmware directory.
                  data = {
                      "name": "Lector",
                      "version": version,
                      "erase": False,
                      "builds": [
                          {
                              "chipFamily": "ESP32-C3",
                              "parts": [
                                  {"path": f"firmware/{fw_dir}/boot_app0.bin", "offset": 57344},
                                  {"path": f"firmware/{fw_dir}/firmware.bin", "offset": 65536},
                              ],
                          }
                      ],
                  }
              data["version"] = version
              with open(path, "w") as fh:
                  json.dump(data, fh, indent=2)
                  fh.write("\n")
          PY
          cd site
          git config user.name "lector-release-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "flash/firmware/${FW_DIR}" "flash/${VERSION_FILE}"
          for m in $MANIFESTS; do git add "flash/$m"; done
          if git diff --cached --quiet; then
            echo "No firmware changes to publish."
          else
            git commit -m "chore(flash): publish ${VERSION}"
            git push
          fi

      # No explicit Pages rebuild is requested here. The flasher site is deployed by
      # its own "Deploy site to GitHub Pages" workflow, which runs on every push to
      # that repository, so the push above already rebuilds it. The build_type of that
      # site is "workflow", and POST /pages/builds only serves sites deployed straight
      # from a branch: it answered 403 on every release regardless of what the token
      # was allowed to do, and the warning it printed blamed the token for it.
