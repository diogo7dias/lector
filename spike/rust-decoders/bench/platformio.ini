; QEMU bench for the Rust decoder spike: JPEGDEC, PNGdec, tinfl and uzlib at the firmware's
; pins and patches against the Rust staticlib in ../ on the same images. Standalone project:
; it never touches the firmware's platformio.ini or .pio.
[platformio]
default_envs = c3, s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11 -fexceptions
build_flags =
  -std=gnu++2a
  -fno-exceptions
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free
lib_deps =
  https://github.com/bitbank2/PNGdec.git#9a9c585fd39d148c5517597b02ce490e0fdb1bb4
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
extra_scripts = pre:bench.py

[env:c3]
board = esp32-c3-devkitm-1
custom_rust_target = riscv32imc-unknown-none-elf

[env:s3]
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
custom_rust_target = xtensa-esp32s3-none-elf
